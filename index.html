<!doctype html>
<html lang="en" dir="auto">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta
      name="description"
      content="A romantic love timer counting precious moments together since our anniversary"
    />
    <meta name="author" content="Love Timer App" />
    <meta
      name="keywords"
      content="love, timer, anniversary, relationship, romance"
    />
    <meta
      name="theme-color"
      content="#0b0b16"
      media="(prefers-color-scheme: dark)"
    />
    <meta
      name="theme-color"
      content="#e8ecfb"
      media="(prefers-color-scheme: light)"
    />

    <!-- iOS app behavior (native wrapper and home-screen installs) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Love Timer" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Open Graph / Social Media -->
    <meta property="og:title" content="Our Love Timer 💕" />
    <meta
      property="og:description"
      content="Counting every precious second of our love story"
    />
    <meta property="og:type" content="website" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Our Love Timer 💕" />
    <meta
      name="twitter:description"
      content="Counting every precious second of our love story"
    />

    <!-- Favicon (inline heart, no external asset needed) -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23ff5e8a' d='M12 21s-7.5-4.9-10-9.5C.4 8 2 4.5 5.5 4c2-.3 3.9.7 4.9 2.3h3.2c1-1.6 2.9-2.6 4.9-2.3C22 4.5 23.6 8 22 11.5 19.5 16.1 12 21 12 21z'/%3E%3C/svg%3E"
    />

    <title>Our Love Timer 💕</title>
  </head>
  <body>
    <!-- Skip link for keyboard navigation -->
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <!-- Ambient scene: soft light blobs that the glass refracts -->
    <div class="scene" aria-hidden="true">
      <div class="scene-blob scene-blob-1"></div>
      <div class="scene-blob scene-blob-2"></div>
      <div class="scene-blob scene-blob-3"></div>
      <div class="scene-grain"></div>
    </div>

    <!-- Floating glass control bar -->
    <nav class="control-bar glass" role="region" aria-label="Display controls">
      <button
        id="toggle-theme"
        class="control-button"
        aria-label="Toggle between light and dark theme"
        title="Toggle theme"
      >
        <span class="control-icon" aria-hidden="true">◐</span>
        <span id="theme-status" class="control-label">Dark mode</span>
      </button>
      <span class="control-divider" aria-hidden="true"></span>
      <button
        id="toggle-animations"
        class="control-button"
        aria-label="Toggle heart animations on or off"
        title="Toggle animations"
      >
        <span class="control-icon" aria-hidden="true">✦</span>
        <span id="animation-status" class="control-label"
          >Pause animations</span
        >
      </button>
      <span class="control-divider" aria-hidden="true"></span>
      <button
        id="open-settings"
        class="control-button"
        aria-label="Edit anniversary date"
        title="Edit anniversary date"
        aria-haspopup="dialog"
      >
        <span class="control-icon" aria-hidden="true">♥</span>
        <span class="control-label">Our date</span>
      </button>
    </nav>

    <main id="main-content" class="container" role="main">
      <header class="hero-header">
        <p class="eyebrow" id="page-eyebrow">Together for</p>
        <h1 class="title" id="page-title">Every Second Counts</h1>
      </header>

      <section aria-labelledby="timer-section-heading" class="timer-section">
        <h2 id="timer-section-heading" class="visually-hidden">
          Love Timer Display
        </h2>

        <!-- Main glass hero card with diffraction edge -->
        <div class="hero-card glass diffract" id="hero-card">
          <div
            class="breakdown"
            role="group"
            aria-label="Time together, broken down"
          >
            <div class="unit-tile glass-inner">
              <span class="unit-value" id="time-days">–</span>
              <span class="unit-label" id="label-days">days</span>
            </div>
            <div class="unit-tile glass-inner">
              <span class="unit-value" id="time-hours">–</span>
              <span class="unit-label" id="label-hours">hours</span>
            </div>
            <div class="unit-tile glass-inner">
              <span class="unit-value" id="time-minutes">–</span>
              <span class="unit-label" id="label-minutes">min</span>
            </div>
            <div class="unit-tile glass-inner">
              <span class="unit-value" id="time-seconds">–</span>
              <span class="unit-label" id="label-seconds">sec</span>
            </div>
          </div>

          <div
            class="timer"
            id="timer"
            aria-live="polite"
            aria-label="Number of seconds elapsed since our anniversary"
            role="timer"
          >
            Loading...
          </div>

          <p class="duration-summary" id="time-summary"></p>

          <div class="anniversary-block">
            <p
              id="daysRemaining"
              class="days-until"
              aria-live="polite"
              aria-label="Days remaining until next anniversary"
            ></p>
            <div
              class="anniversary-progress"
              id="anniversary-progress"
              role="progressbar"
              aria-label="Progress toward the next anniversary"
              aria-valuemin="0"
              aria-valuemax="100"
              aria-valuenow="0"
            >
              <div
                class="anniversary-progress-fill"
                id="anniversary-progress-fill"
              ></div>
            </div>
          </div>
        </div>
      </section>

      <section
        aria-labelledby="message-section-heading"
        class="message-section"
      >
        <h2 id="message-section-heading" class="visually-hidden">
          Romantic Messages
        </h2>
        <div class="message-card glass diffract">
          <div
            class="message"
            id="message"
            role="status"
            aria-live="polite"
            aria-label="Rotating romantic message"
          >
            Our love grows stronger with each passing moment
          </div>
        </div>
      </section>

      <footer role="contentinfo" class="hero-footer">
        <div class="date" id="date" aria-label="Anniversary start date"></div>
      </footer>

      <!-- Decorative elements hidden from screen readers -->
      <div
        class="hearts-container"
        id="hearts-container"
        aria-hidden="true"
        role="presentation"
      ></div>
    </main>

    <!-- Settings sheet: edit the anniversary date -->
    <div id="settings-backdrop" class="sheet-backdrop" hidden></div>
    <div
      id="settings-sheet"
      class="settings-sheet glass diffract"
      role="dialog"
      aria-modal="true"
      aria-labelledby="settings-title"
      hidden
    >
      <h2 id="settings-title" class="sheet-title">Our anniversary</h2>
      <p class="sheet-subtitle">Pick the day your story began.</p>
      <label class="sheet-label" for="start-date-input">Start date</label>
      <input id="start-date-input" class="sheet-input" type="date" />
      <button id="reset-date" class="sheet-reset" type="button">
        Use our original date
      </button>
      <div class="sheet-actions">
        <button
          id="cancel-settings"
          class="sheet-button secondary"
          type="button"
        >
          Cancel
        </button>
        <button id="save-date" class="sheet-button primary" type="button">
          Save
        </button>
      </div>
    </div>

    <!-- Loading indicator for better UX -->
    <div id="loading-indicator" class="loading" aria-hidden="true">
      <div class="loading-card glass diffract">
        <div class="loading-spinner"></div>
        <span>Loading love timer...</span>
      </div>
    </div>

    <!-- Error message container -->
    <div
      id="error-container"
      class="error-message glass diffract"
      role="alert"
      aria-live="assertive"
      style="display: none"
    >
      <h2>Error</h2>
      <p id="error-text"></p>
      <button id="retry-button" class="retry-button">Try Again</button>
    </div>

    <script type="module" src="src/main.js"></script>
  </body>
</html>
