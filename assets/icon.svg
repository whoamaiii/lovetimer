<?xml version="1.0" encoding="UTF-8"?>
<!-- Love Timer app icon source (1024x1024). iOS applies the rounded mask itself. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1a38"/>
      <stop offset="0.55" stop-color="#101024"/>
      <stop offset="1" stop-color="#0b0b16"/>
    </linearGradient>
    <radialGradient id="glowPink" cx="0.32" cy="0.28" r="0.6">
      <stop offset="0" stop-color="#ff5e8a" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ff5e8a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="0.75" cy="0.78" r="0.6">
      <stop offset="0" stop-color="#7c6cff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#7c6cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff5e8a" stop-opacity="0.5"/>
      <stop offset="0.6" stop-color="#ff5e8a" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ff5e8a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="heart" x1="0.2" y1="0.05" x2="0.8" y2="1">
      <stop offset="0" stop-color="#ff8fb3"/>
      <stop offset="0.5" stop-color="#ff5e8a"/>
      <stop offset="1" stop-color="#e0447c"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glowPink)"/>
  <rect width="1024" height="1024" fill="url(#glowViolet)"/>

  <!-- Soft halo behind the heart -->
  <circle cx="512" cy="512" r="430" fill="url(#halo)"/>

  <!-- The heart (smooth rounded lobes) -->
  <g transform="translate(212 217) scale(25)">
    <path
      d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"
      fill="url(#heart)"/>
    <path
      d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"
      fill="url(#sheen)"/>
  </g>
</svg>
