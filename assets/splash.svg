<?xml version="1.0" encoding="UTF-8"?>
<!-- Love Timer launch screen, light variant (2732x2732, center-cropped on device). -->
<svg xmlns="http://www.w3.org/2000/svg" width="2732" height="2732" viewBox="0 0 2732 2732">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3f0ff"/>
      <stop offset="0.55" stop-color="#e8ecfb"/>
      <stop offset="1" stop-color="#e2e6f7"/>
    </linearGradient>
    <radialGradient id="glowPink" cx="0.38" cy="0.34" r="0.4">
      <stop offset="0" stop-color="#ff5e8a" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ff5e8a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="0.66" cy="0.66" r="0.45">
      <stop offset="0" stop-color="#7c6cff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#7c6cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff5e8a" stop-opacity="0.25"/>
      <stop offset="0.6" stop-color="#ff5e8a" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ff5e8a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="heart" x1="0.2" y1="0.05" x2="0.8" y2="1">
      <stop offset="0" stop-color="#ff7ca6"/>
      <stop offset="0.5" stop-color="#ff5e8a"/>
      <stop offset="1" stop-color="#d63d72"/>
    </linearGradient>
  </defs>

  <rect width="2732" height="2732" fill="url(#bg)"/>
  <rect width="2732" height="2732" fill="url(#glowPink)"/>
  <rect width="2732" height="2732" fill="url(#glowViolet)"/>

  <!-- Centered heart, small enough to survive center-cropping on any iPhone -->
  <circle cx="1366" cy="1366" r="360" fill="url(#halo)"/>
  <g transform="translate(1186 1184) scale(15)">
    <path
      d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"
      fill="url(#heart)"/>
  </g>
</svg>
