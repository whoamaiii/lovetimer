name: Build iOS IPA

# Builds an UNSIGNED IPA of the Love Timer iOS app on GitHub's macOS runners.
# Download the artifact and install it with AltStore or Sideloadly, which
# re-sign it with your own (free) Apple ID. See docs/IPHONE_APP.md.

on:
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app and sync into iOS project
        run: |
          npm run build
          npx cap sync ios

      - name: Build unsigned .app
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry LoveTimer.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: love-timer-ipa
          path: LoveTimer.ipa
          retention-days: 30
